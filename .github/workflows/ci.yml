name: Current source Host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows source Web
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    env:
      DSH_HARNESS: ${{ github.workspace }}/core
      DSH_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          architecture: x64
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - name: Enable source paths
        run: git config --global core.longpaths true
      - name: Check out the declared Host
        uses: actions/checkout@v4
        with:
          repository: vb2250158/deepseek-harness
          ref: 54931fbd25050ef036e44b1daec931da2bfe7b39
          path: core
      - name: Verify the declared environment
        run: |
          $tested = Get-Content -Raw tested-environment.json | ConvertFrom-Json
          if ((git -C $env:DSH_HARNESS rev-parse HEAD) -ne $tested.core.commit) { throw 'Unexpected Host commit' }
          if ((node --version) -ne "v$($tested.node)") { throw 'Unexpected Node version' }
          if ((pnpm --version) -ne $tested.pnpm) { throw 'Unexpected pnpm version' }
          node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 is required' }
      - name: Install Host dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile
      - name: Build Host native addon
        working-directory: core
        run: pnpm run build:native-system
      - name: Build Host libraries
        working-directory: core
        run: pnpm exec tsx scripts/compile-referenced-projects.ts host-libraries
      - name: Build Client libraries
        working-directory: core
        run: pnpm run build:lib:client
      - name: Select current Host dependencies
        run: node scripts/prepare-tested-host.mjs
      - name: Install plugin tools
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Current behavior regressions
        run: pnpm run test --maxWorkers 2
      - name: Build plugin artifacts
        run: pnpm run build
      - name: Privacy scan
        run: pnpm run check:pii
      - name: Verify package contents
        run: npm pack --dry-run
